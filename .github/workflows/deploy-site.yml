# Builds site/ and deploys it to GitHub Pages.
# Runs ONLY when the repository owner starts it by hand (Actions tab -> "Deploy website" -> Run workflow).
# It never runs on push. Prerequisite: Settings -> Pages -> Source = "GitHub Actions".
name: Deploy website

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to publish the site to GitHub Pages'
        required: true
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # The data files in site/public/data are generated by `python site/scripts/export_data.py`
      # from the committed results/ and the raw data; they are committed, so CI needs no Python.
      - run: npm run test:parity
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - run: npm run check:links
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
