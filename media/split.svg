<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Temporal split: May train, June validation, July test" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1000" height="150" rx="16" fill="#0b1020"/>
<rect x="40" y="40" width="300" height="62" rx="12" fill="#2f6fed" opacity="0.22" stroke="#2f6fed" stroke-width="2"/>
<rect x="40" y="40" width="0" height="62" rx="12" fill="#2f6fed" opacity="0.55"><animate attributeName="width" values="0;300;300;0" keyTimes="0;0.4;0.85;1" dur="7s" begin="0.0s" repeatCount="indefinite"/></rect>
<text x="60" y="68" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#fff">MAY</text>
<text x="60" y="90" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#e4e6ff">train</text>
<rect x="345" y="40" width="300" height="62" rx="12" fill="#8a5cf6" opacity="0.22" stroke="#8a5cf6" stroke-width="2"/>
<rect x="345" y="40" width="0" height="62" rx="12" fill="#8a5cf6" opacity="0.55"><animate attributeName="width" values="0;300;300;0" keyTimes="0;0.4;0.85;1" dur="7s" begin="0.8s" repeatCount="indefinite"/></rect>
<text x="365" y="68" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#fff">JUNE</text>
<text x="365" y="90" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#e4e6ff">validation</text>
<rect x="650" y="40" width="310" height="62" rx="12" fill="#ff5a4d" opacity="0.22" stroke="#ff5a4d" stroke-width="2"/>
<rect x="650" y="40" width="0" height="62" rx="12" fill="#ff5a4d" opacity="0.55"><animate attributeName="width" values="0;310;310;0" keyTimes="0;0.4;0.85;1" dur="7s" begin="1.6s" repeatCount="indefinite"/></rect>
<text x="670" y="68" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#fff">JULY</text>
<text x="670" y="90" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#e4e6ff">test · scored once</text>
<line x1="40" y1="124" x2="950" y2="124" stroke="#3a4390" stroke-width="2"/><polygon points="960,124 948,118 948,130" fill="#3a4390"/>
<text x="40" y="142" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#6f76b8">time →  no shuffling, no leakage from the future</text>
</svg>